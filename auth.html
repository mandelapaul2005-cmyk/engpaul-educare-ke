
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EngPaul Educare KE - Student Access</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #eef3f9;
  color: #172554;
}

.container {
  max-width: 420px;
  margin: 45px auto;
  padding: 25px;
  background: white;
  border-radius: 15px;
  box-shadow: 0 5px 20px #00000015;
}

h1 {
  text-align: center;
  color: #123c75;
}

.subtitle {
  text-align: center;
  color: #64748b;
}

input {
  width: 100%;
  padding: 14px;
  margin: 9px 0;
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  border: none;
  border-radius: 8px;
  background: #1456a0;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.switch {
  text-align: center;
  margin-top: 18px;
}

.switch a {
  color: #1456a0;
  font-weight: bold;
  text-decoration: none;
}

.hidden {
  display: none;
}

#message {
  text-align: center;
  margin-top: 15px;
  font-size: 14px;
  overflow-wrap: anywhere;
}

footer {
  text-align: center;
  margin-top: 25px;
  color: #64748b;
  font-size: 12px;
}
</style>
</head>

<body>

<div class="container">

<h1>EngPaul Educare KE</h1>
<p class="subtitle">Your Learning Journey Starts Here</p>

<div id="registerBox">
<h2>Create Student Account</h2>

<form id="registerForm">
<input type="text" id="fullName"
placeholder="Full Name" required>

<input type="email" id="regEmail"
placeholder="Email Address" required>

<input type="password" id="regPassword"
placeholder="Create Password (6+ characters)"
minlength="6" required>

<button type="submit">Register</button>
</form>

<p class="switch">
Already registered?
<a href="#" id="showLogin">Login</a>
</p>
</div>

<div id="loginBox" class="hidden">
<h2>Student Login</h2>

<form id="loginForm">
<input type="email" id="loginEmail"
placeholder="Email Address" required>

<input type="password" id="loginPassword"
placeholder="Password" required>

<button type="submit">Login</button>
</form>

<p class="switch">
<a href="#" id="forgotPassword">Forgot Password?</a>
</p>

<p class="switch">
New student?
<a href="#" id="showRegister">Create Account</a>
</p>
</div>

<p id="message"></p>

<footer>
© 2026 EngPaul Educare KE
<br>High School & TVET Learning Platform
</footer>

</div>

<script type="module">
import { auth } from "./firebase.js";

import {
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  sendPasswordResetEmail,
  updateProfile
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

const registerBox = document.getElementById("registerBox");
const loginBox = document.getElementById("loginBox");
const message = document.getElementById("message");

function showMessage(text, success = false) {
  message.textContent = text;
  message.style.color = success ? "green" : "red";
}

document.getElementById("showLogin").onclick = (e) => {
  e.preventDefault();
  registerBox.classList.add("hidden");
  loginBox.classList.remove("hidden");
  showMessage("");
};

document.getElementById("showRegister").onclick = (e) => {
  e.preventDefault();
  loginBox.classList.add("hidden");
  registerBox.classList.remove("hidden");
  showMessage("");
};

document.getElementById("registerForm")
.addEventListener("submit", async (e) => {
  e.preventDefault();

  const name = document.getElementById("fullName").value.trim();
  const email = document.getElementById("regEmail").value.trim();
  const password = document.getElementById("regPassword").value;

  try {
    const result = await createUserWithEmailAndPassword(
      auth, email, password
    );

    await updateProfile(result.user, {
      displayName: name
    });

    showMessage(
      "Account created successfully! Student registration is working.",
      true
    );

    e.target.reset();

  } catch (error) {
    showMessage(error.message);
  }
});

document.getElementById("loginForm")
.addEventListener("submit", async (e) => {
  e.preventDefault();

  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;

  try {
    await signInWithEmailAndPassword(auth, email, password);

    showMessage(
      "Login successful! Your student account is authenticated.",
      true
    );

  } catch (error) {
    showMessage(error.message);
  }
});

document.getElementById("forgotPassword")
.addEventListener("click", async (e) => {
  e.preventDefault();

  const email = document.getElementById("loginEmail").value.trim();

  if (!email) {
    showMessage("Enter your email address first.");
    return;
  }

  try {
    await sendPasswordResetEmail(auth, email);
    showMessage("Password reset email sent. Check your inbox.", true);

  } catch (error) {
    showMessage(error.message);
  }
});
</script>

</body>
</html>
